spring.application.name=urban-furniture-accounting

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urban_furniture_erp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sneha$13}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.startup-checks.enabled=${APP_STARTUP_CHECKS_ENABLED:true}
app.console.enabled=${APP_CONSOLE_ENABLED:false}
